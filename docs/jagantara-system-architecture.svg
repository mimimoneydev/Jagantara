<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="1836" viewBox="0 0 1624 1836" role="img" aria-labelledby="title desc">
  <title id="title">Jagantara system architecture</title>
  <desc id="desc">Architecture diagram showing the user experience, agent orchestration, external intelligence services, evidence model, and Cloudflare Sites runtime for Jagantara.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#12382d" flood-opacity=".08"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#143c31" flood-opacity=".07"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1 1l9 5-9 5" fill="none" stroke="#20a9d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#2c765e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="headerGlow" x1="0" x2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6fbf8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#245b47"/><stop offset="1" stop-color="#15382d"/></linearGradient>
    <style>
      text { font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; fill: #124f6b; }
      .title { font-size: 50px; font-weight: 900; letter-spacing: -1.7px; }
      .brandname { font-size: 30px; font-weight: 850; fill: #b95638; }
      .subtitle { font-size: 18px; font-weight: 650; fill: #71859a; }
      .section { fill: #075777; font-size: 16px; font-weight: 850; letter-spacing: .2px; }
      .section-note { fill: #71859a; font-size: 17px; font-weight: 700; }
      .card-title { fill: #075777; font-size: 21px; font-weight: 850; }
      .card-sub { fill: #71859a; font-size: 15px; font-weight: 600; }
      .tiny { fill: #71859a; font-size: 13px; font-weight: 600; }
      .pill { font-size: 13px; font-weight: 800; }
      .white { fill: white; }
      .green { fill: #214f40; }
      .brick { fill: #b95638; }
      .orange { fill: #d98337; }
      .purple { fill: #6559a5; }
      .mono { font-family: "Noto Sans Mono", monospace; font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1624" height="1836" fill="#fbfcfb"/>
  <circle cx="1500" cy="110" r="220" fill="#eaf5f0" opacity=".45"/>
  <circle cx="72" cy="660" r="190" fill="#fff0dc" opacity=".33"/>

  <!-- Header -->
  <g filter="url(#shadow)">
    <rect x="40" y="32" width="1544" height="178" rx="42" fill="url(#headerGlow)" stroke="#b9dded" stroke-width="2"/>
  </g>
  <g transform="translate(70 57)">
    <circle cx="64" cy="64" r="62" fill="url(#brand)"/>
    <path d="M20 83C43 61 54 103 77 78S101 25 123 39" fill="none" stroke="#e8b36b" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
    <circle cx="28" cy="80" r="10" fill="#f7efe1" stroke="#e8b36b" stroke-width="5"/>
    <circle cx="78" cy="77" r="10" fill="#f7efe1" stroke="#e8b36b" stroke-width="5"/>
    <circle cx="119" cy="39" r="10" fill="#f7efe1" stroke="#e8b36b" stroke-width="5"/>
    <path d="M42 30c25-12 49-7 68 11" fill="none" stroke="#94aa91" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
  <text x="230" y="103" class="title">SYSTEM ARCHITECTURE</text>
  <text x="233" y="143" class="brandname">Jagantara</text>
  <text x="233" y="174" class="subtitle">Evidence-aware heritage research • Qloo cultural discovery • Cloudflare edge runtime</text>

  <!-- Section 1 -->
  <g filter="url(#soft)"><rect x="58" y="238" width="1508" height="274" rx="34" fill="#f3fafc" stroke="#8fd0ed" stroke-width="3"/></g>
  <rect x="84" y="255" width="382" height="40" rx="20" fill="#075777"/>
  <text x="108" y="281" class="section white">01 · EXPERIENCE &amp; JOURNEY INPUT</text>
  <text x="1058" y="282" class="section-note">A private-by-design, account-free journey</text>

  <g filter="url(#soft)">
    <rect x="84" y="319" width="330" height="155" rx="24" fill="#174c3d"/>
    <circle cx="137" cy="371" r="27" fill="#e7b36d"/>
    <circle cx="137" cy="363" r="8" fill="#174c3d"/><path d="M120 392c4-16 30-16 34 0" fill="#174c3d"/>
    <text x="181" y="365" class="card-title white">Visitor</text>
    <text x="181" y="391" class="card-sub" style="fill:#c9d9d1">Browser · desktop or mobile</text>
    <text x="110" y="438" class="tiny" style="fill:#dbe7e1">Shares context, not identity</text>
  </g>
  <path d="M421 397h72" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="500" y="314" width="490" height="166" rx="24" fill="white" stroke="#edb06a" stroke-width="3"/>
    <rect x="524" y="334" width="76" height="76" rx="20" fill="#fff0df"/>
    <path d="M546 385l16-31 16 31M551 376h22" fill="none" stroke="#cf7430" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="622" y="359" class="card-title">React Journey Builder</text>
    <text x="622" y="386" class="card-sub">Next.js 16 · React 19 · Tailwind CSS</text>
    <g transform="translate(524 423)">
      <rect width="89" height="30" rx="15" fill="#f2eee4"/><text x="16" y="20" class="pill green">PLACE</text>
      <rect x="98" width="91" height="30" rx="15" fill="#f2eee4"/><text x="114" y="20" class="pill green">PERIOD</text>
      <rect x="198" width="115" height="30" rx="15" fill="#f2eee4"/><text x="213" y="20" class="pill green">MEMORY</text>
      <rect x="322" width="138" height="30" rx="15" fill="#f2eee4"/><text x="337" y="20" class="pill green">INTERESTS</text>
    </g>
  </g>
  <path d="M998 397h67" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="1072" y="314" width="466" height="166" rx="24" fill="white" stroke="#6fc2eb" stroke-width="3"/>
    <text x="1103" y="350" class="card-title">Interactive Atlas Output</text>
    <text x="1103" y="378" class="card-sub">Responsive map, timeline and story cards</text>
    <g transform="translate(1103 405)">
      <rect width="123" height="34" rx="17" fill="#e7f4ee"/><text x="18" y="22" class="pill green">TIMELINE</text>
      <rect x="133" width="116" height="34" rx="17" fill="#eeeaf7"/><text x="153" y="22" class="pill purple">TASTE LENS</text>
      <rect x="259" width="168" height="34" rx="17" fill="#fff0df"/><text x="277" y="22" class="pill orange">WHY THIS APPEARED</text>
    </g>
  </g>

  <path d="M812 513v24" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Section 2 -->
  <g filter="url(#soft)"><rect x="58" y="548" width="1508" height="490" rx="34" fill="#fffaf3" stroke="#f0c188" stroke-width="3"/></g>
  <rect x="84" y="565" width="388" height="40" rx="20" fill="#075777"/>
  <text x="108" y="591" class="section white">02 · AGENTIC AI ORCHESTRATION</text>
  <text x="1050" y="592" class="section-note">One request, visible chain of custody</text>

  <g filter="url(#soft)">
    <rect x="84" y="630" width="255" height="116" rx="22" fill="white" stroke="#9ed2ea" stroke-width="2.5"/>
    <circle cx="123" cy="669" r="20" fill="#dff2fb"/><text x="115" y="676" class="pill" style="fill:#1688bb">↗</text>
    <text x="157" y="665" class="card-title" style="font-size:19px">API Routes</text>
    <text x="110" y="706" class="mono green">POST /api/journey</text>
    <text x="110" y="730" class="mono green">GET  /api/health</text>
  </g>
  <path d="M347 688h65" stroke="#2c765e" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="421" y="622" width="760" height="132" rx="28" fill="#174c3d"/>
    <circle cx="483" cy="688" r="40" fill="#e8b36b"/>
    <path d="M461 691h44M483 669v44" stroke="#174c3d" stroke-width="7" stroke-linecap="round"/>
    <text x="544" y="671" class="card-title white" style="font-size:28px">runHeritageAgent()</text>
    <text x="544" y="701" class="card-sub" style="fill:#d2dfd8">Coordinates research, taste intelligence, evidence checks and trace output</text>
    <text x="544" y="728" class="tiny" style="fill:#e8b36b">lib/agent.ts · deterministic fallbacks · no fabricated recommendations</text>
  </g>
  <path d="M1189 688h58" stroke="#2c765e" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <g filter="url(#soft)">
    <rect x="1255" y="630" width="283" height="116" rx="22" fill="white" stroke="#9ed2ea" stroke-width="2.5"/>
    <text x="1282" y="665" class="card-title" style="font-size:19px">JourneyResult JSON</text>
    <text x="1282" y="696" class="tiny">timeline · narrative · discoveries</text>
    <text x="1282" y="721" class="tiny">service state · agent trace</text>
  </g>

  <path d="M801 756v39" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <rect x="84" y="805" width="270" height="163" rx="22" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="118" cy="842" r="19" fill="#fff0df"/><text x="111" y="849" class="pill orange">1</text>
    <text x="148" y="848" class="card-title" style="font-size:18px">Validate &amp; normalize</text>
    <text x="110" y="881" class="tiny">Sanitize input and enforce</text><text x="110" y="902" class="tiny">2–3 public interests</text>
    <text x="110" y="935" class="tiny brick">Reject surname inference</text>

    <rect x="373" y="805" width="270" height="163" rx="22" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="407" cy="842" r="19" fill="#fff0df"/><text x="400" y="849" class="pill orange">2</text>
    <text x="437" y="848" class="card-title" style="font-size:18px">Retrieve sources</text>
    <text x="399" y="881" class="tiny">Wikipedia search + extracts</text><text x="399" y="902" class="tiny">Up to 4 source pages</text>
    <text x="399" y="935" class="tiny brick">7-second bound</text>

    <rect x="662" y="805" width="270" height="163" rx="22" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="696" cy="842" r="19" fill="#fff0df"/><text x="689" y="849" class="pill orange">3</text>
    <text x="726" y="848" class="card-title" style="font-size:18px">Compose narrative</text>
    <text x="688" y="881" class="tiny">OpenRouter when configured</text><text x="688" y="902" class="tiny">Conservative source fallback</text>
    <text x="688" y="935" class="tiny brick">Source-constrained prompt</text>

    <rect x="951" y="805" width="270" height="163" rx="22" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="985" cy="842" r="19" fill="#fff0df"/><text x="978" y="849" class="pill orange">4</text>
    <text x="1015" y="848" class="card-title" style="font-size:18px">Resolve &amp; discover</text>
    <text x="977" y="881" class="tiny">Qloo search → entity IDs</text><text x="977" y="902" class="tiny">Insights across 4 categories</text>
    <text x="977" y="935" class="tiny brick">Explainability requested</text>

    <rect x="1240" y="805" width="298" height="163" rx="22" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="1274" cy="842" r="19" fill="#fff0df"/><text x="1267" y="849" class="pill orange">5</text>
    <text x="1304" y="848" class="card-title" style="font-size:18px">Claim-check &amp; trace</text>
    <text x="1266" y="881" class="tiny">Require source URL or Qloo ID</text><text x="1266" y="902" class="tiny">Accept / reject every item</text>
    <text x="1266" y="935" class="tiny brick">Expose tool status to UI</text>
  </g>
  <path d="M354 886h18M643 886h18M932 886h18M1221 886h18" stroke="#20a9d6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="812" y="1005" text-anchor="middle" class="section-note" style="fill:#b95638">Sourced history stays fixed while the taste lens changes cultural discoveries</text>

  <path d="M812 1039v24" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Section 3 -->
  <g filter="url(#soft)"><rect x="58" y="1074" width="1508" height="458" rx="34" fill="#f2faf7" stroke="#88cfbd" stroke-width="3"/></g>
  <rect x="84" y="1091" width="430" height="40" rx="20" fill="#075777"/>
  <text x="108" y="1117" class="section white">03 · EXTERNAL INTELLIGENCE &amp; EVIDENCE</text>
  <text x="1061" y="1118" class="section-note">Server-only egress and credentials</text>

  <g filter="url(#soft)">
    <rect x="84" y="1155" width="440" height="196" rx="24" fill="white" stroke="#86c9e8" stroke-width="2.5"/>
    <circle cx="132" cy="1206" r="30" fill="#e6f5fb"/>
    <path d="M114 1207h36M132 1189c9 10 9 25 0 35M132 1189c-9 10-9 25 0 35M108 1198h48M108 1216h48" fill="none" stroke="#1688bb" stroke-width="2.5"/>
    <text x="178" y="1198" class="card-title">Wikipedia / MediaWiki</text>
    <text x="178" y="1226" class="card-sub">Historical source retrieval</text>
    <text x="112" y="1271" class="mono green">action=query · generator=search</text>
    <text x="112" y="1296" class="tiny">Plain-text extracts + retrievable URLs</text>
    <rect x="112" y="1311" width="173" height="26" rx="13" fill="#e7f4ee"/><text x="130" y="1329" class="pill green">PUBLIC SOURCE DATA</text>
  </g>

  <g filter="url(#soft)">
    <rect x="543" y="1155" width="440" height="196" rx="24" fill="white" stroke="#a69bda" stroke-width="2.5"/>
    <circle cx="591" cy="1206" r="30" fill="#efecfa"/>
    <path d="M591 1186l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#6b5db3"/>
    <text x="637" y="1198" class="card-title">OpenRouter Chat Completions</text>
    <text x="637" y="1226" class="card-sub">Optional narrative composition</text>
    <text x="571" y="1271" class="mono purple">LLM_PROVIDER=openrouter</text>
    <text x="571" y="1296" class="tiny">JSON mode · low temperature · 12s bound</text>
    <rect x="571" y="1311" width="185" height="26" rx="13" fill="#efecfa"/><text x="589" y="1329" class="pill purple">OPTIONAL / FALLBACK SAFE</text>
  </g>

  <g filter="url(#soft)">
    <rect x="1002" y="1155" width="536" height="196" rx="24" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <circle cx="1050" cy="1206" r="30" fill="#fff0df"/>
    <circle cx="1042" cy="1202" r="7" fill="#cf7430"/><circle cx="1060" cy="1195" r="5" fill="#cf7430"/><circle cx="1059" cy="1216" r="8" fill="#cf7430"/><path d="M1048 1200l8-3M1047 1207l7 6" stroke="#cf7430" stroke-width="3"/>
    <text x="1096" y="1198" class="card-title">Qloo Taste Intelligence</text>
    <text x="1096" y="1226" class="card-sub">Aggregate cross-domain affinity</text>
    <text x="1030" y="1271" class="mono orange">/search  →  /v2/insights</text>
    <text x="1030" y="1296" class="tiny">Artist · book · movie · destination</text>
    <rect x="1030" y="1311" width="220" height="26" rx="13" fill="#fff0df"/><text x="1048" y="1329" class="pill orange">64-ENTRY · 10-MIN CACHE</text>
  </g>

  <text x="84" y="1395" class="card-title" style="font-size:18px">Evidence contract carried end-to-end</text>
  <g transform="translate(84 1415)">
    <rect width="326" height="70" rx="18" fill="white" stroke="#76bda5" stroke-width="2"/><circle cx="30" cy="35" r="8" fill="#2d765e"/><text x="51" y="31" class="pill green">SOURCE-BACKED HISTORY</text><text x="51" y="52" class="tiny">Claim requires an HTTP source URL</text>
    <rect x="346" width="326" height="70" rx="18" fill="white" stroke="#d6ad72" stroke-width="2"/><circle cx="376" cy="35" r="8" fill="#9a682f"/><text x="397" y="31" class="pill" style="fill:#9a682f">FAMILY TESTIMONY</text><text x="397" y="52" class="tiny">Attributed to user-supplied context</text>
    <rect x="692" width="356" height="70" rx="18" fill="white" stroke="#a69bda" stroke-width="2"/><circle cx="722" cy="35" r="8" fill="#6559a5"/><text x="743" y="31" class="pill purple">QLOO TASTE CONNECTION</text><text x="743" y="52" class="tiny">Requires retained Qloo entity ID</text>
    <rect x="1068" width="386" height="70" rx="18" fill="white" stroke="#d38a72" stroke-width="2"/><circle cx="1098" cy="35" r="8" fill="#b95638"/><text x="1119" y="31" class="pill brick">CREATIVE RECONSTRUCTION</text><text x="1119" y="52" class="tiny">Explicitly marked as imagined</text>
  </g>

  <path d="M812 1533v25" stroke="#20a9d6" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Section 4 -->
  <g filter="url(#soft)"><rect x="58" y="1568" width="1508" height="226" rx="34" fill="#f5f8fa" stroke="#aec9d7" stroke-width="3"/></g>
  <rect x="84" y="1585" width="330" height="40" rx="20" fill="#075777"/>
  <text x="108" y="1611" class="section white">04 · EDGE RUNTIME &amp; DELIVERY</text>
  <text x="1043" y="1612" class="section-note">Portable build, Cloudflare execution</text>

  <g transform="translate(84 1651)">
    <rect width="250" height="92" rx="20" fill="white" stroke="#9ed2ea" stroke-width="2.5"/>
    <text x="26" y="37" class="card-title" style="font-size:18px">Next.js App Router</text><text x="26" y="64" class="tiny">RSC + client components</text>
    <path d="M255 46h52" stroke="#20a9d6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="315" width="250" height="92" rx="20" fill="white" stroke="#9ed2ea" stroke-width="2.5"/>
    <text x="341" y="37" class="card-title" style="font-size:18px">Vinext + Vite 8</text><text x="341" y="64" class="tiny">Worker-compatible build</text>
    <path d="M570 46h52" stroke="#20a9d6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="630" width="310" height="92" rx="20" fill="#174c3d"/>
    <text x="656" y="37" class="card-title white" style="font-size:18px">Cloudflare Worker</text><text x="656" y="64" class="tiny" style="fill:#d5e3dc">OpenAI Sites fetch handler</text>
    <path d="M945 46h52" stroke="#20a9d6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1005" width="445" height="92" rx="20" fill="white" stroke="#edb06a" stroke-width="2.5"/>
    <text x="1031" y="32" class="card-title" style="font-size:18px">Server-only configuration</text>
    <text x="1031" y="58" class="tiny">QLOO_API_KEY · OPENROUTER_API_KEY · LLM_MODEL</text>
    <text x="1031" y="79" class="tiny brick">D1 / R2 unbound by default · no database required</text>
  </g>

  <text x="812" y="1822" text-anchor="middle" class="subtitle" style="font-size:14px">Jagantara · history from sources, memory with attribution, affinity without ancestry</text>
</svg>
